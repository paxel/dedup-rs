# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_dedup-rs
# Analysed by the coverage job of .github/workflows/ci.yml on pushes to summer
# (the free plan analyses the main branch only); Automatic Analysis is off in the project's
# settings. The release gate reads this project's quality gate.
sonar.organization=paxel
sonar.projectKey=paxel_dedup-rs
sonar.projectName=dedup-rs

# Unit tests live inline in src/ (#[cfg(test)] modules), so they are analysed as
# sources; the integration tests have their own directories.
sonar.sources=crates/dedup-core/src,crates/dedup-cli/src,crates/dedup-gui/src
sonar.tests=crates/dedup-core/tests,crates/dedup-cli/tests
sonar.sourceEncoding=UTF-8

# Clippy: the job writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage: the same job's tarpaulin run writes lcov.info.
sonar.rust.lcov.reportPaths=lcov.info
