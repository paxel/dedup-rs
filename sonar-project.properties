# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_dedup-rs
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pull
# requests and pushes to summer; Automatic Analysis is off in the project's settings. The
# release gate and the weekly Security run fail on every open finding that
# code-scanning-ignores.toml does not accept.
sonar.organization=paxel
sonar.projectKey=paxel_dedup-rs
sonar.projectName=dedup-rs

# Unit tests live inline in src/ (#[cfg(test)] modules), so they are analysed as
# sources; the integration tests have their own directories.
sonar.sources=crates/dedup-core/src,crates/dedup-cli/src,crates/dedup-gui/src
sonar.tests=crates/dedup-core/tests,crates/dedup-cli/tests
sonar.sourceEncoding=UTF-8

# Coverage: the Rust gate's tarpaulin runs, one lcov per part of coverage-floors.toml.
sonar.rust.lcov.reportPaths=coverage/core.lcov,coverage/cli.lcov,coverage/gui.lcov
