# cargo-deny policy (docs/adr/0005-security-hardening.md). The Security workflow
# reports on every push; the release gate fails on any error.

[advisories]
# RustSec: every vulnerability fails; unmaintained and yanked crates too.
yanked = "deny"
unmaintained = "all"
# Each ignore names the advisory and why it cannot be fixed yet.
ignore = []

[licenses]
# Permissive licenses plus MPL-2.0 (file-level copyleft). The GPL family, LGPL
# included, is not on the list and therefore fails. OFL-1.1 and Ubuntu-font-1.0
# cover the fonts egui embeds.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "bzip2-1.0.6",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between the workspace crates carry versions, so this only
# catches a `*` requirement on a crates.io dependency.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
