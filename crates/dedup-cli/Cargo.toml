[package]
# Published as `dedup-rs-cli` (`dedup-cli` is taken on crates.io); the
# installed binary is still `dedup`.
name = "dedup-rs-cli"
version = "0.1.1"
edition = "2024"
description = "dedup-rs, a forensic data-inheritance triage tool: CLI and desktop app (binary name: dedup)"
license = "MIT"
repository = "https://github.com/paxel/dedup-rs"

[[bin]]
name = "dedup"
path = "src/main.rs"

[dependencies]
dedup-rs-core = { path = "../dedup-core", version = "0.1.1" }
dedup-rs-gui = { path = "../dedup-gui", version = "0.1.1" }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
anyhow = "1.0"
log = "0.4"
indicatif = "0.17"
ctrlc = "3.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
