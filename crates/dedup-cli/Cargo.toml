[package]
name = "dedup-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dedup"
path = "src/main.rs"

[dependencies]
dedup-core = { path = "../dedup-core" }
dedup-gui = { path = "../dedup-gui" }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
anyhow = "1.0"
indicatif = "0.17"
ctrlc = "3.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
