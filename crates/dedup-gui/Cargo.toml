[package]
# Published as `dedup-rs-gui` (the shorter names are taken on crates.io);
# the lib target keeps the `dedup_gui` name so imports stay unchanged.
name = "dedup-rs-gui"
version = "3.1.0"
edition = "2024"
description = "LCARS-styled egui desktop app of dedup-rs, a forensic data-inheritance triage tool"
license = "MIT"
repository = "https://github.com/paxel/dedup-rs"

[lib]
name = "dedup_gui"

# The GUI-only launcher: on Windows it is built with the windows subsystem so a
# double-click opens no console window; the CLI-capable `dedup` binary lives in
# the dedup-rs-cli crate.
[[bin]]
name = "dedup-gui"
path = "src/bin/dedup_gui.rs"

[dependencies]
dedup-rs-core = { path = "../dedup-core", version = "3.1.0" }
redb = "2.1"
# eframe's defaults minus "winit/default", whose Adwaita window frame (only drawn
# natively on Wayland) pulls in the unmaintained ttf-parser (RUSTSEC-2026-0192).
# winit's backends are named in the Linux section below.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "wgpu", "x11"] }
egui = "0.37"
crossbeam-channel = "0.5"
chrono = "0.4"
open = "5"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
# Every default format except "avif", which is only the AVIF encoder (rav1e):
# the app never writes AVIF, and decoding it needs the separate avif-native.
# No "exr": the exr crate pulls in the unmaintained paste (RUSTSEC-2024-0436).
# No "rayon": nothing calls its parallel APIs, and it locks ravif and rav1e.
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
id3 = "1"
egui_extras = "0.37"
log = "0.4"
tempfile = "3.10"

# To pick winit's X11 backend through eframe's event-loop hook, and to name the
# backends eframe no longer enables through winit's defaults; the same winit
# eframe already uses.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
zip = "9"
lopdf = "0.47"
