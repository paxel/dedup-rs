[package]
name = "dedup-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
dedup-core = { path = "../dedup-core" }
redb = "2.1"
eframe = "0.35"
egui = "0.35"
crossbeam-channel = "0.5"
chrono = "0.4"
open = "5"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
image = "0.25"
id3 = "1"
egui_extras = "0.35"
log = "0.4"
tempfile = "3.10"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
zip = "8.6"
lopdf = "0.43"
