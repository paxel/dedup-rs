[package]
name = "dedup-core"
version = "0.1.0"
edition = "2024"

[dependencies]
redb = "2.1"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
blake3 = "1.5"
rayon = "1.10"
walkdir = "2.5"
image = "0.25"
infer = "0.19"
mime_guess = "2.0"
lopdf = "0.43"
symphonia = { version = "0.5", features = ["all"] }

[dev-dependencies]
tempfile = "3.10"
blake3 = "1.5"
criterion = "0.5"

[[bench]]
name = "similar"
harness = false
