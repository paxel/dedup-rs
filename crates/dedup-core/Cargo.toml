[package]
# Published as `dedup-rs-core` (the shorter names are taken on crates.io);
# the lib target keeps the `dedup_core` name so imports stay unchanged.
name = "dedup-rs-core"
version = "3.1.0"
edition = "2024"
description = "Core engine of dedup-rs: content-addressed file index, duplicate/diff/similarity operations, perceptual fingerprints"
license = "MIT"
repository = "https://github.com/paxel/dedup-rs"

[lib]
name = "dedup_core"

[dependencies]
redb = "2.1"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = "2.0"
blake3 = "1.5"
rayon = "1.10"
walkdir = "2.5"
# Every default format except "avif", which is only the AVIF encoder (rav1e):
# the app never writes AVIF, and decoding it needs the separate avif-native.
# No "exr": the exr crate pulls in the unmaintained paste (RUSTSEC-2024-0436).
# No "rayon": nothing calls its parallel APIs, and it locks ravif and rav1e.
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
infer = "0.19"
mime_guess = "2.0"
lopdf = "0.47"
symphonia = { version = "0.5", features = ["all"] }
# Chromaprint acoustic fingerprints (pure Rust port) for codec-blind audio matching.
rusty-chromaprint = "0.3"
kamadak-exif = "0.6.1"
zip = "9"
quick-xml = "0.41.0"
calamine = "0.38"
tar = "0.4.46"
flate2 = "1.1.9"
mail-parser = "0.11.5"
bip39 = "2.2.2"
log = "0.4"
chrono = "0.4"
# Encrypting a recovered archive password at rest (behind an app passphrase).
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3.10"
blake3 = "1.5"
criterion = "0.5"

[[bench]]
name = "similar"
harness = false
