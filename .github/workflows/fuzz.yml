name: Fuzz

# The parsers dedup runs on untrusted files (docs/security/threat-model.md, threat 6), fuzzed
# weekly and by hand with the Rust stack of paxel/gates. Each target starts from the real
# files in fuzz/seeds/<target>; libFuzzer takes the longest input it may build from the
# biggest seed.
on:
  schedule:
    - cron: "37 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    with:
      stack: rust
      targets: |
        fingerprint
        archive
      seconds: 900
      prepare: mkdir -p "fuzz/corpus/$TARGET" && cp "fuzz/seeds/$TARGET"/* "fuzz/corpus/$TARGET/"
