# Fuzzing (docs/security/threat-model.md, threat 6): each target in fuzz/ runs
# for 15 minutes a week from the seed inputs in fuzz/seeds/. Report only. A
# finding fails the run and uploads the crashing input; it becomes a fixture in
# crates/dedup-core/tests/fixtures/fuzz/ with a regression test and a fix.
name: Fuzz

on:
  schedule:
    - cron: "37 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [fingerprint, archive]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The nightly fuzz/rust-toolchain.toml pins; rustup installs it on first use.
      - name: Toolchain from fuzz/rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - name: Fuzz for 15 minutes
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          cp "seeds/${{ matrix.target }}"/* "corpus/${{ matrix.target }}/"
          cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" -- \
            -max_total_time=900 -rss_limit_mb=2048 -max_len=1048576 -timeout=60
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts
