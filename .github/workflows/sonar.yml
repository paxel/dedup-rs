# SonarQube Cloud analysis of summer after each CI run there. Report only: the
# quality gate shows on https://sonarcloud.io/summary/new_code?id=paxel_dedup-rs
# and fails no push; the release gate reads it and fails a release
# (docs/adr/0005-security-hardening.md). What is analysed is in
# sonar-project.properties.
#
# Coverage is not measured again here: CI's coverage job uploads lcov.info and
# this workflow downloads it from that run. A CI run without it (a failing
# test) leaves the scan without coverage.
name: SonarQube Cloud

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [summer]

permissions:
  contents: read
  actions: read

jobs:
  sonar:
    name: SonarQube Cloud analysis
    # Only this repository's own pushes: code from a fork never runs here with
    # the token. A cancelled CI run was superseded by a newer push.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      # The commit CI tested, with the full history for blame and new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System dependencies (ALSA link dep)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Clippy report for the analyzer
        run: |
          mkdir -p build
          cargo clippy --workspace --all-targets --locked --message-format=json > build/clippy-report.json
      - name: Coverage from the CI run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
