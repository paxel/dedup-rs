# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, signed releases, …) and
# publishes the result for the README badge. Report only.
# The action requires: no top-level env or defaults, and only approved actions
# in this job.
name: Scorecard

on:
  push:
    branches: [summer]
  branch_protection_rule:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
