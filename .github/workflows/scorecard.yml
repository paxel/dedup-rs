# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned actions,
# token permissions, branch protection, …) and publishes the result. Its alerts land in
# code scanning, where the release gate and the weekly Security run count them like
# CodeQL's: each one fails until it is fixed or accepted in code-scanning-ignores.toml.
# The action requires: no top-level env or defaults, and only approved actions in this job.
name: Scorecard

on:
  push:
    branches: [summer]
  branch_protection_rule:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
