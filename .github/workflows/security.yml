# Security: cargo-deny (RustSec advisories, licenses, banned crates, crate
# sources) per deny.toml. Report-only — a finding turns this workflow and its
# badge red but blocks nothing; the release gate runs the same check and fails
# (docs/adr/0005-security-hardening.md). The weekly run catches advisories
# published against an unchanged lock file.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - name: Advisories, licenses, bans, sources
        run: cargo deny --locked check
