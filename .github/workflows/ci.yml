# Gate for every push and pull request.
#
# Tiered: the Ubuntu lane is the full gate — formatting, clippy with zero
# warnings, and the complete workspace test suite, with software Vulkan
# (lavapipe) plus ffmpeg and poppler installed so the GUI's headless render
# tests and the tool-gated tests actually run. The Windows and macOS lanes
# build the workspace and run the core + CLI suites only, catching platform
# breakage in minutes; GUI render tests stay a Linux concern (one pixel
# baseline, not three).
name: CI

# Push covers the working branches; pull_request covers forks. A push that
# also belongs to an open same-repo PR would run twice — the concurrency
# group below collapses that.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # head_ref (the branch) for PR events, ref for pushes — so a push to a
  # branch with an open PR shares one group and the duplicate run is
  # cancelled instead of burning a second full matrix.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege: jobs that write (the GitHub Release) widen this themselves.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (full gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System dependencies (ALSA link dep, software Vulkan, gated tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            mesa-vulkan-drivers libvulkan1 \
            ffmpeg poppler-utils
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # Feeds the README's Coveralls badge. Default-branch only: coverage on every
  # branch push would double CI time for a number nobody reads off a branch.
  coverage:
    name: Coverage (Coveralls)
    if: github.event_name == 'push' && github.ref == 'refs/heads/summer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System dependencies (ALSA link dep, software Vulkan, gated tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            mesa-vulkan-drivers libvulkan1 \
            ffmpeg poppler-utils
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-tarpaulin
      - name: Measure line coverage
        run: cargo tarpaulin --workspace --engine llvm --timeout 300 --out Lcov
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: lcov.info
      # For the SonarQube Cloud workflow, which runs after this one.
      - name: Keep lcov.info for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  windows:
    name: Windows (build + core/cli tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Core and CLI tests
        run: cargo test --locked -p dedup-rs-core -p dedup-rs-cli

  macos:
    name: macOS (build + core/cli tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Core and CLI tests
        run: cargo test --locked -p dedup-rs-core -p dedup-rs-cli
