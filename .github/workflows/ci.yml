name: CI

# dedup-rs's gates. The standard's part comes from paxel/gates: the OSV gate, the Rust gate on
# Linux (format, lint set, clippy, all tests, the coverage ratchet of core, cli and gui) and
# SonarQube Cloud. The Rust gate installs software Vulkan (lavapipe) plus ffmpeg and poppler,
# so the GUI's headless render tests and the tool-gated tests run there. Windows and macOS are
# dedup-rs's own lanes: build, clippy and the core and CLI suites, which catch platform
# breakage; GUI render tests stay a Linux concern (docs/adr/0006-move-to-gates.md).
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1

  rust:
    uses: paxel/gates/.github/workflows/rust.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    with:
      # ALSA is rodio's link dependency; lavapipe renders the GUI tests; ffmpeg and poppler
      # run the tool-gated tests.
      apt-packages: libasound2-dev pkg-config mesa-vulkan-drivers libvulkan1 ffmpeg poppler-utils
      # One part per crate: each part runs that crate's tests.
      coverage: |
        core -p dedup-rs-core --timeout 300
        cli -p dedup-rs-cli --timeout 300
        gui -p dedup-rs-gui --timeout 300

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (build + core/cli tests)
            runner: windows-latest
          - name: macOS (build + core/cli tests)
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Clippy on shipped code
        run: cargo clippy --locked --all-features -- -D warnings
      - name: Core and CLI tests
        run: cargo test --locked -p dedup-rs-core -p dedup-rs-cli

  sonar:
    needs: rust
    uses: paxel/gates/.github/workflows/sonar.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
