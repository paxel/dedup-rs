# Release on tag: `git tag v3.2.0 && git push --tags` produces everything.
#
#   version         — the tag equals the crate version, and the tagged commit is on summer,
#                     whose ruleset only takes pull requests with green, up-to-date CI
#   gate            — paxel/gates release-gate.yml: open alerts and SonarQube Cloud findings,
#                     vulnerabilities and licences, the CHANGELOG section for the version
#   build-linux     — .deb (packaging/mkdeb.sh --release) + binary tar.gz + AppImage
#   build-windows   — zip with dedup.exe (console) and dedup-gui.exe (GUI)
#   build-macos     — binary tar.gz + unsigned dedup.app in a .dmg, per arch
#   provenance      — paxel/gates provenance.yml: source SBOM, an attestation for every
#                     file and its Sigstore bundle
#   release         — GitHub Release, notes = the CHANGELOG section for the tag
#   publish-crates  — crates.io in dependency order (core → gui → cli)
#   channels        — Homebrew formula + Scoop manifest pushed to the tap/bucket
#
# One-time setup (repository secrets):
#   GATES_ALERTS_TOKEN   — fine-grained token, Secret scanning alerts: read (the gate)
#   CARGO_REGISTRY_TOKEN — crates.io API token (publish scope)
#   CHANNEL_PAT          — PAT with push access to paxel/homebrew-tap and
#                          paxel/scoop-bucket
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

# Least privilege: jobs that write (the GitHub Release) widen this themselves.
permissions:
  contents: read

jobs:
  version:
    name: Tag is the crate version, on summer
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history of summer, to find the tagged commit in it.
          fetch-depth: 0
          persist-credentials: false
      - id: v
        run: |
          tag=${RELEASE_TAG#v}
          ver=$(grep -m1 '^version' crates/dedup-cli/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ "$ver" = "$tag" ] || { echo "::error::tag v$tag != crate version $ver"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/summer \
            || { echo "::error::the tagged commit $GITHUB_SHA is not on summer"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  build-linux:
    name: Linux artifacts (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          # Native arm64 runner (free for public repos) — restores the arm64
          # coverage the retired sr.ht manifest used to provide.
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config dpkg-dev lintian
      - name: Build .deb (also builds the release binary)
        run: packaging/mkdeb.sh --release --out dist
      - name: Binary tarball
        run: |
          ver=${RELEASE_TAG#v}
          tar -C target/release -czf "dist/dedup-${ver}-linux-${{ matrix.arch }}.tar.gz" dedup
      - name: AppImage (reuses the release binary)
        run: packaging/mkappimage.sh --release --out dist --no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Windows artifacts
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binaries
        run: cargo build --release --locked -p dedup-rs-cli -p dedup-rs-gui
      - name: Zip (console dedup.exe + GUI dedup-gui.exe)
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/dedup.exe, `
                                 target/release/dedup-gui.exe, `
                                 LICENSE `
                           -DestinationPath "dist/dedup-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: dist/*

  build-macos:
    name: macOS artifacts (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # The last Intel image GitHub offers (macos-13 was retired 2025-12;
          # this label lives until 2027-08). When it goes, switch the x86_64
          # artifact to a cross-compile from the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --release --locked -p dedup-rs-cli
      - name: Tarball + app bundle + dmg
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist
          tar -C target/release -czf "dist/dedup-${ver}-macos-${{ matrix.arch }}.tar.gz" dedup
          packaging/mkapp.sh target/release/dedup "$ver" dist
          rm -rf dist/dedup.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*

  provenance:
    needs: [build-linux, build-windows, build-macos]
    uses: paxel/gates/.github/workflows/provenance.yml@dbf6f6086174ef97fe465d3ffee31bf3985f5b81 # v1.4.1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: dedup
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  release:
    name: GitHub Release
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The built files, the source SBOM and the Sigstore bundle, from the provenance job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "dedup $RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "dedup $RELEASE_TAG" \
              --notes-file notes.md \
              dist/*
          fi

  publish-crates:
    name: crates.io (core → gui → cli)
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Publish in dependency order (skipping versions already on the index)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ver=${RELEASE_TAG#v}
          publish() {
            # A crates.io version is immutable — republishing is a hard error,
            # so a rerun after a partial publish must skip what already landed.
            if curl -fsSL -A "dedup-rs-release-workflow" \
                 "https://crates.io/api/v1/crates/$1/${ver}" >/dev/null 2>&1; then
              echo "$1 ${ver} already on crates.io — skipping"
            else
              cargo publish --locked -p "$1"
              sleep 30
            fi
          }
          publish dedup-rs-core
          publish dedup-rs-gui
          publish dedup-rs-cli

  channels:
    name: Homebrew tap + Scoop bucket
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Render formula and manifest from the templates
        run: |
          ver=${RELEASE_TAG#v}
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          mkdir -p out
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha dedup-$ver-macos-arm64.tar.gz)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha dedup-$ver-macos-x86_64.tar.gz)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha dedup-$ver-linux-x86_64.tar.gz)/" \
              packaging/homebrew/dedup.rb.tmpl > out/dedup.rb
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_WINDOWS_X86_64}}/$(sha dedup-$ver-windows-x86_64.zip)/" \
              packaging/scoop/dedup.json.tmpl > out/dedup.json
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "dedup-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/dedup.rb tap/Formula/dedup.rb
          git -C tap add Formula/dedup.rb
          git -C tap commit -m "dedup $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/dedup.json bucket/bucket/dedup.json
          git -C bucket add bucket/dedup.json
          git -C bucket commit -m "dedup $ver"
          git -C bucket push
