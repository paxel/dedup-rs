# Release on tag: `git tag v0.1.0 && git push --tags` produces everything.
#
#   gate            — the full Linux gate once more (fmt, clippy, all tests)
#   build-linux     — .deb (packaging/mkdeb.sh --release) + binary tar.gz
#   build-windows   — zip with dedup.exe (console) and dedup-gui.exe (GUI)
#   build-macos     — binary tar.gz + unsigned dedup.app in a .dmg, per arch
#   release         — GitHub Release, notes = the CHANGELOG section for the tag
#   publish-crates  — crates.io in dependency order (core → gui → cli)
#   channels        — Homebrew formula + Scoop manifest pushed to the tap/bucket
#
# One-time setup (repository secrets):
#   CARGO_REGISTRY_TOKEN — crates.io API token (publish scope)
#   CHANNEL_PAT          — PAT with push access to paxel/homebrew-tap and
#                          paxel/scoop-bucket
name: Release

on:
  push:
    tags: ["v*"]
  # Releasing from the Actions UI: Run workflow → type the tag. The same
  # pipeline runs either way; RELEASE_TAG resolves to the typed tag or the
  # pushed one. `gh release create` makes the tag at HEAD when it doesn't
  # exist yet, so the button alone can cut a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.2)"
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  gate:
    name: Gate (Linux, full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config \
            mesa-vulkan-drivers libvulkan1 \
            ffmpeg poppler-utils
      - name: Tag matches the crate version
        run: |
          ver=$(grep -m1 '^version' crates/dedup-cli/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != crate version $ver" >&2; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Coverage is a release ratchet: the floor is the last release's line
      # coverage (rounded down) — raise it when coverage rises, never lower it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Coverage floor
        run: cargo tarpaulin --workspace --engine llvm --timeout 300 --fail-under 76

  build-linux:
    name: Linux artifacts (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          # Native arm64 runner (free for public repos) — restores the arm64
          # coverage the retired sr.ht manifest used to provide.
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config dpkg-dev lintian
      - name: Build .deb (also builds the release binary)
        run: packaging/mkdeb.sh --release --out dist
      - name: Binary tarball
        run: |
          ver=${RELEASE_TAG#v}
          tar -C target/release -czf "dist/dedup-${ver}-linux-${{ matrix.arch }}.tar.gz" dedup
      - name: AppImage (reuses the release binary)
        run: packaging/mkappimage.sh --release --out dist --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Windows artifacts
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked -p dedup-rs-cli -p dedup-rs-gui
      - name: Zip (console dedup.exe + GUI dedup-gui.exe)
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/dedup.exe, `
                                 target/release/dedup-gui.exe, `
                                 LICENSE `
                           -DestinationPath "dist/dedup-$ver-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS artifacts (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # The last Intel image GitHub offers (macos-13 was retired 2025-12;
          # this label lives until 2027-08). When it goes, switch the x86_64
          # artifact to a cross-compile from the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p dedup-rs-cli
      - name: Tarball + app bundle + dmg
        run: |
          ver=${RELEASE_TAG#v}
          mkdir -p dist
          tar -C target/release -czf "dist/dedup-${ver}-macos-${{ matrix.arch }}.tar.gz" dedup
          packaging/mkapp.sh target/release/dedup "$ver" dist
          rm -rf dist/dedup.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  release:
    name: GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "dedup $RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "dedup $RELEASE_TAG" \
              --notes-file notes.md \
              dist/*
          fi

  publish-crates:
    name: crates.io (core → gui → cli)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Publish in dependency order (skipping versions already on the index)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ver=${RELEASE_TAG#v}
          publish() {
            # A crates.io version is immutable — republishing is a hard error,
            # so a rerun after a partial publish must skip what already landed.
            if curl -fsSL -A "dedup-rs-release-workflow" \
                 "https://crates.io/api/v1/crates/$1/${ver}" >/dev/null 2>&1; then
              echo "$1 ${ver} already on crates.io — skipping"
            else
              cargo publish --locked -p "$1"
              sleep 30
            fi
          }
          publish dedup-rs-core
          publish dedup-rs-gui
          publish dedup-rs-cli

  channels:
    name: Homebrew tap + Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render formula and manifest from the templates
        run: |
          ver=${RELEASE_TAG#v}
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          mkdir -p out
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_MACOS_ARM64}}/$(sha dedup-$ver-macos-arm64.tar.gz)/" \
              -e "s/{{SHA_MACOS_X86_64}}/$(sha dedup-$ver-macos-x86_64.tar.gz)/" \
              -e "s/{{SHA_LINUX_X86_64}}/$(sha dedup-$ver-linux-x86_64.tar.gz)/" \
              packaging/homebrew/dedup.rb.tmpl > out/dedup.rb
          sed -e "s/{{VERSION}}/$ver/g" \
              -e "s/{{SHA_WINDOWS_X86_64}}/$(sha dedup-$ver-windows-x86_64.zip)/" \
              packaging/scoop/dedup.json.tmpl > out/dedup.json
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "dedup-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/dedup.rb tap/Formula/dedup.rb
          git -C tap add Formula/dedup.rb
          git -C tap commit -m "dedup $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/dedup.json bucket/bucket/dedup.json
          git -C bucket add bucket/dedup.json
          git -C bucket commit -m "dedup $ver"
          git -C bucket push
